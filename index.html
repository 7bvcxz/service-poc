<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1020">
  <title>Service POC | Index</title>
  <style>
    :root { color-scheme: dark; --accent: #60a5fa; --muted: #98a2b3; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: radial-gradient(ellipse at 85% 0%, #17213a, transparent 48%), #0b1020; color: #f1f5f9; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { width: min(960px, calc(100% - 40px)); margin: 0 auto; padding: 80px 0; }
    .eyebrow { margin: 0 0 8px; color: var(--accent); font-size: 12px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(32px, 5vw, 52px); letter-spacing: -.05em; }
    .intro { color: var(--muted); margin: 12px 0 42px; }
    .section-label { margin: 0 0 14px; color: #cbd5e1; font-size: 14px; font-weight: 600; }
    .poc-card { display: grid; grid-template-columns: minmax(170px, 1.1fr) minmax(250px, 2.5fr) auto auto; align-items: center; gap: 24px; width: 100%; padding: 24px 28px; border: 1px solid #2c3751; border-radius: 18px; background: #151d31; color: inherit; text-decoration: none; transition: transform .15s, background .15s, border-color .15s; }
    .poc-card:hover, .poc-card:focus-visible { transform: translateY(-2px); background: #1b2740; border-color: var(--accent); outline: none; }
    .name { display: block; font-size: 19px; font-weight: 750; letter-spacing: -.025em; }
    .meta { display: block; color: var(--muted); font-size: 12px; margin-bottom: 4px; }
    .description { color: #c4ccda; font-size: 14px; }
    .score { min-width: 116px; text-align: right; font-variant-numeric: tabular-nums; }
    .score strong { font-size: 25px; color: var(--accent); }
    .score small { color: var(--muted); font-size: 12px; }
    .arrow { color: var(--accent); font-size: 24px; }
    .footnote { margin: 16px 0 0; font-size: 12px; color: #8693a9; }
    @media (max-width: 680px) { main { padding-top: 46px; } .poc-card { grid-template-columns: 1fr auto; gap: 12px; padding: 22px; } .description { grid-column: 1 / -1; grid-row: 2; } .score { grid-column: 1; grid-row: 3; text-align: left; } .arrow { grid-column: 2; grid-row: 3; text-align: right; } }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">POC COLLECTION</p>
    <h1>Service POC</h1>
    <p class="intro">서비스 아이디어의 실험 결과를 모아보는 공간입니다.</p>
    <p class="section-label">실험 목록 · 1개</p>
    <a class="poc-card" href="./poc/01-TestService.html" aria-label="01-TestService 테스트 페이지 열기">
      <span><span class="meta">이름</span><span class="name">01-TestService</span></span>
      <span class="description"><span class="meta">간단 설명</span>새로운 서비스 아이디어를 빠르게 살펴보고 검증하는 첫 번째 테스트 POC입니다.</span>
      <span class="score"><span class="meta">점수 · 임시</span><strong>86</strong><small> / 100</small></span>
      <span class="arrow" aria-hidden="true">→</span>
    </a>
    <p class="footnote">표시된 점수는 구조 확인을 위한 임의 값입니다.</p>
  </main>
</body>
</html>
