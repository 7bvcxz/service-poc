<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>아이콘 광학 중심·여백 보정</title><style>*{box-sizing:border-box}body{margin:0;padding:20px;background:#101828;color:#f3f5ff;font:16px/1.6 system-ui}main{max-width:900px;margin:auto}.box{padding:20px;margin:18px 0;border:1px solid #465673;background:#202d42;border-radius:16px}.fields,.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}label{display:block}input,select,button{font:inherit;padding:9px;margin:5px 0;color:white;background:#101828;border:1px solid #8193b0;border-radius:8px;max-width:100%;width:100%}button{width:auto;cursor:pointer;background:#526ac2}button:focus-visible,input:focus-visible{outline:3px solid gold}button:disabled{opacity:.4}.card{text-align:center;padding:10px;background:#111e31;border-radius:12px}.card svg{width:100%;max-width:120px}#error{color:#ffb5b5}#result{white-space:pre-line}@media(max-width:390px){body{padding:10px}.box{padding:12px}}</style><main><h1>앱 아이콘, 크기가 달라도 균형 있게</h1><p>앱 디자이너가 도형의 중심 오프셋과 안전 여백을 보정해 48·96·192px 아이콘을 비교하고 SVG를 저장하는 오프라인 도구야. 실제 시각 인지가 아닌 기하학적 중심의 근사치야.</p><section class="box"><h2>3단계 사용법</h2><ol><li>예제를 불러오거나 도형 크기·위치를 수정해.</li><li>중심·여백 계산으로 전후를 비교해.</li><li>보정 SVG를 내려받아 디자인에 재사용해.</li></ol><button id="example">예제 체험</button><div class="fields"><label>도형<select id="shape"><option value="circle">원</option><option value="triangle">삼각형</option><option value="square">사각형</option></select></label><label>너비 % (10~90)<input id="width" type="number" value="56"></label><label>높이 % (10~90)<input id="height" type="number" value="62"></label><label>X 오프셋 % (-40~40)<input id="x" type="number" value="12"></label><label>Y 오프셋 % (-40~40)<input id="y" type="number" value="-8"></label><label>안전 여백 % (0~30)<input id="margin" type="number" value="8"></label></div><button id="run">중심·여백 계산</button><button id="reset">초기화</button><button id="save" disabled>SVG 저장</button><p id="error" role="alert"></p></section><section class="box"><h2>전후 결과</h2><p id="result" aria-live="polite">계산을 눌러 결과를 확인해.</p><div id="cards" class="cards"></div></section></main><script>
const $=x=>document.getElementById(x),fields=['shape','width','height','x','y','margin'];let state=null;function invalidate(){state=null;$('save').disabled=true;$('cards').replaceChildren();$('result').textContent='입력이 바뀌었어. 다시 계산해.';$('error').textContent=''}fields.forEach(x=>$(x).addEventListener('input',invalidate));function set(v){Object.entries(v).forEach(([k,val])=>$(k).value=val);invalidate()}function read(){const v={shape:$('shape').value};for(const [k,lo,hi] of [['width',10,90],['height',10,90],['x',-40,40],['y',-40,40],['margin',0,30]]){const raw=$(k).value;if(!raw.trim())throw Error(k+' 값을 입력해.');const n=Number(raw);if(!Number.isFinite(n)||n<lo||n>hi)throw Error(k+' 범위: '+lo+'~'+hi);v[k]=n}return v}
function svg(v,size,after,scale){const x=50+(after?0:v.x),y=50+(after?0:v.y),w=v.width*(after?scale:1),h=v.height*(after?scale:1);const figure=v.shape==='circle'?'<ellipse cx="'+x+'" cy="'+y+'" rx="'+w/2+'" ry="'+h/2+'" fill="#9b88f8"/>':v.shape==='square'?'<rect x="'+(x-w/2)+'" y="'+(y-h/2)+'" width="'+w+'" height="'+h+'" fill="#9b88f8"/>':'<polygon points="'+x+','+(y-h/2)+' '+(x+w/2)+','+(y+h/2)+' '+(x-w/2)+','+(y+h/2)+'" fill="#9b88f8"/>';return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="'+size+'" height="'+size+'"><rect width="100" height="100" rx="16" fill="#263b57"/><rect x="'+v.margin+'" y="'+v.margin+'" width="'+(100-2*v.margin)+'" height="'+(100-2*v.margin)+'" fill="none" stroke="#fff" stroke-dasharray="2 2"/>'+figure+'<path d="M45 50h10 M50 45v10" stroke="#fbbf24"/></svg>'}
function run(){try{const v=read(),scale=Math.min(1,(100-2*v.margin)/v.width,(100-2*v.margin)/v.height);state={v,scale};$('error').textContent='';$('result').textContent='원본 중심 거리 '+Math.hypot(v.x,v.y).toFixed(2)+'%p → 보정 후 0.00%p\n크기 비율 '+(scale*100).toFixed(1)+'% · 보정 후 '+(v.width*scale).toFixed(1)+' × '+(v.height*scale).toFixed(1)+'%';$('cards').replaceChildren();for(const size of [48,96,192]){const card=document.createElement('div');card.className='card';const title=document.createElement('h3');title.textContent=size+'px';card.append(title);for(const after of [false,true]){const label=document.createElement('p');label.textContent=after?'보정 후':'보정 전';card.append(label);const frame=document.createElement('div');frame.innerHTML=svg(v,size,after,scale);card.append(frame)}$('cards').append(card)}$('save').disabled=false}catch(e){invalidate();$('error').textContent=e.message;$('result').textContent='입력을 수정하고 다시 계산해.'}}
$('run').onclick=run;$('example').onclick=()=>{set({shape:'triangle',width:56,height:62,x:12,y:-8,margin:8});run()};$('reset').onclick=()=>set({shape:'circle',width:56,height:62,x:12,y:-8,margin:8});$('save').onclick=()=>{if(!state)return;const blob=new Blob([svg(state.v,192,true,state.scale)],{type:'image/svg+xml'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='icon-optical-192.svg';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
</script></html>
