<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>픽셀 팔레트 일괄 변환</title><style>body{margin:0;background:#111827;color:#f3f4f6;font:16px system-ui}main{max-width:940px;margin:auto;padding:24px}h1{font-size:clamp(25px,5vw,38px)}p{line-height:1.6;color:#cbd5e1}.panel{background:#1f2937;padding:20px;border-radius:16px;margin:18px 0}button,input,select{font:inherit;border-radius:8px;padding:10px}button{background:#a78bfa;color:#17132a;border:0;cursor:pointer;margin:4px}button:focus-visible,input:focus-visible{outline:3px solid #facc15}label{display:block;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}.pixels{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));aspect-ratio:1;max-width:320px}.pixel{border:1px solid #111827}.mapping{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.mapping input{width:85px;height:48px;padding:2px}#error{color:#fda4af;min-height:1.5em}small{color:#cbd5e1}a{color:#c4b5fd}</style></head><body><main><h1>픽셀 팔레트 일괄 변환</h1><p>픽셀아트 제작자가 여러 프레임에 흩어진 색상을 한 번에 바꿔 전후 차이를 확인하고 JSON으로 저장하는 로컬 도구야.</p><div class="panel"><strong>3단계 사용법</strong><p>① 예제 체험 ② 원본·변경 색상을 선택하고 변환 ③ 결과 확인 후 JSON 저장</p><button id="sample">예제 체험</button><button id="reset">초기화</button></div><div class="panel"><h2>색상 치환 규칙</h2><div class="mapping"><label>바꿀 원본 색상 <input id="from" type="color" value="#ef4444"></label><label>새로운 색상 <input id="to" type="color" value="#22c55e"></label></div><button id="apply">모든 프레임 변환</button><button id="undo">마지막 변환 되돌리기</button><p id="error" role="alert"></p><p id="summary" aria-live="polite"></p></div><div class="grid"><section class="panel"><h2>원본 프레임</h2><div id="before" class="pixels" role="img" aria-label="변환 전 8x8 픽셀"></div></section><section class="panel"><h2>변환 결과</h2><div id="after" class="pixels" role="img" aria-label="변환 후 8x8 픽셀"></div></section></div><div class="panel"><label>프레임 선택 <select id="frame"><option value="0">프레임 1</option><option value="1">프레임 2</option></select></label><button id="export">JSON 파일 저장</button><p><small>프레임별 8×8 색상 데이터만 저장해. 이미지 업로드나 서버 전송은 없어. 이 도구는 픽셀 팔레트 변환 예제이며 이미지 파일 자체를 수정하지 않아.</small></p></div></main><script>
const RED='#ef4444',BLUE='#3b82f6',BG='#111827';const original=[Array.from({length:64},(_,i)=>i%9===0?RED:i%7===0?BLUE:BG),Array.from({length:64},(_,i)=>i%5===0?RED:i%11===0?BLUE:BG)];let frames=[],history=[],ready=false;const $=id=>document.getElementById(id);function paint(id,data){const root=$(id);root.replaceChildren();for(const color of data){const d=document.createElement('span');d.className='pixel';d.style.backgroundColor=color;root.append(d)}}function render(){const n=Number($('frame').value);paint('before',original[n]);paint('after',frames[n]||original[n]);$('export').disabled=!ready;$('undo').disabled=!history.length}function sample(){frames=original.map(f=>[...f]);history=[];ready=true;$('error').textContent='';$('summary').textContent='예제 준비: 2프레임, 각 64픽셀. 빨간색을 초록색으로 바꿔봐.';render()}function apply(){if(!ready){$('error').textContent='먼저 예제 체험을 눌러줘.';return}const from=$('from').value,to=$('to').value;if(from===to){$('error').textContent='원본과 변경 색상이 같아. 다른 색을 선택해줘.';return}const count=frames.flat().filter(c=>c===from).length;if(!count){$('error').textContent='선택한 원본 색상이 없어. 다른 색을 골라줘.';return}history.push(frames.map(f=>[...f]));frames=frames.map(f=>f.map(c=>c===from?to:c));$('error').textContent='';$('summary').textContent='2프레임에서 총 '+count+'픽셀 변경 완료.';render()}function undo(){if(!history.length)return;frames=history.pop();$('summary').textContent='마지막 변환을 되돌렸어.';$('error').textContent='';render()}function reset(){frames=[];history=[];ready=false;$('frame').value='0';$('from').value=RED;$('to').value='#22c55e';$('error').textContent='';$('summary').textContent='초기화 완료. 예제 체험을 눌러 시작해줘.';render()}function save(){if(!ready)return;const blob=new Blob([JSON.stringify({width:8,height:8,frames},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='pixel-palette-frames.json';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}$('sample').addEventListener('click',sample);$('apply').addEventListener('click',apply);$('undo').addEventListener('click',undo);$('reset').addEventListener('click',reset);$('export').addEventListener('click',save);$('frame').addEventListener('change',render);reset();
</script></body></html>
