<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GIF 프레임 리듬 작업실</title><style>*{box-sizing:border-box}body{font:16px system-ui;margin:0;background:#101827;color:#edf4ff}main{max-width:900px;margin:auto;padding:22px}h1{font-size:clamp(26px,5vw,38px)}p{line-height:1.6;color:#c7d6ed}.panel{background:#1d2a40;padding:20px;border-radius:16px;margin:16px 0}label{display:block;margin:12px 0}input{width:100%;padding:12px;border:1px solid #8fa4c2;border-radius:8px;background:#0e1929;color:white;font:inherit}button{padding:12px 16px;border:0;border-radius:9px;background:#8ed9ed;color:#09212a;font-weight:700;cursor:pointer;margin:5px 5px 5px 0}button:focus-visible,input:focus-visible{outline:3px solid #ffd96b}button.secondary{background:#c4d0e2}.bars{display:flex;align-items:end;gap:10px;min-height:150px;padding:14px 0}.bar{flex:1;min-width:0;text-align:center}.bar div{background:#8ed9ed;border-radius:7px 7px 0 0}.bar small{display:block;overflow-wrap:anywhere}#preview{min-height:100px;display:grid;place-items:center;border-radius:12px;background:#304560;font-size:32px}#status{white-space:pre-wrap;color:#fff}#error{color:#ffb3ae} .stats{font-size:20px;font-weight:700} @media(max-width:400px){main{padding:12px}.panel{padding:13px}.bars{gap:4px}.bar small{font-size:11px}}</style><main><h1>GIF 프레임 리듬 작업실</h1><p>움직이는 스티커 제작자를 위한 프레임 지속시간 편집기. 느린 구간을 찾고 전체 재생 시간을 비교한 뒤 GIF 제작용 타이밍 CSV를 저장해.</p><div class="panel"><strong>3단계 사용법</strong><p>① 예제를 불러오거나 프레임별 밀리초(ms)를 입력해. ② 리듬 분석을 눌러 막대와 재생 시간을 확인해. ③ 수정·재생 후 CSV를 저장해.</p><button id="sample">예제 체험</button><label for="times">프레임 지속시간 (쉼표 구분, 20~10000ms, 최대 30개)</label><input id="times" value="100,100,300,100" autocomplete="off"><button id="analyze">리듬 분석</button><button id="play" class="secondary">미리 재생</button><button id="export" class="secondary">CSV 내보내기</button><button id="reset" class="secondary">초기화</button><p id="error" role="alert"></p></div><div class="panel"><h2>분석 결과</h2><div id="status" role="status">리듬 분석을 눌러 결과를 확인해.</div><div class="bars" id="bars"></div><div id="preview" aria-label="현재 프레임">프레임 대기</div><p>실제 GIF 인코딩은 하지 않아. CSV는 다른 편집기에서 타이밍 참고용으로 사용해.</p></div></main><script>(()=>{'use strict';const $=id=>document.getElementById(id);let data=null,timer=null;const initial='100,100,300,100';function stop(){if(timer){clearTimeout(timer);timer=null}}function clear(){stop();data=null;$('status').textContent='리듬 분석을 눌러 결과를 확인해.';$('bars').replaceChildren();$('preview').textContent='프레임 대기'}function parse(){const raw=$('times').value.trim();if(!raw)throw Error('프레임 시간을 입력해. 예: 100,100,300');const a=raw.split(',').map(x=>x.trim());if(a.length>30)throw Error('프레임은 최대 30개야.');if(a.some(x=>!/^[0-9]+$/.test(x)))throw Error('쉼표로 구분한 정수 밀리초만 입력해.');const nums=a.map(Number);if(nums.some(n=>n<20||n>10000))throw Error('각 프레임은 20~10000ms 범위여야 해.');return nums}function analyze(){stop();try{const nums=parse();data=nums;$('error').textContent='';const total=nums.reduce((a,b)=>a+b,0),avg=total/nums.length;const slow=nums.map((n,i)=>n>avg*1.5?i+1:null).filter(Boolean);$('status').textContent='프레임 '+nums.length+'개 · 전체 '+total+'ms ('+(total/1000).toFixed(2)+'초) · 평균 '+avg.toFixed(1)+'ms\n평균의 1.5배 초과 느린 프레임: '+(slow.join(', ')||'없음');$('bars').replaceChildren();nums.forEach((n,i)=>{const el=document.createElement('div');el.className='bar';const bar=document.createElement('div');bar.style.height=Math.max(12,n/Math.max(...nums)*110)+'px';const caption=document.createElement('small');caption.textContent=(i+1)+'번 '+n+'ms';el.append(bar,caption);$('bars').append(el)});$('preview').textContent='총 '+total+'ms';return true}catch(e){clear();$('error').textContent=e.message;return false}}$('analyze').onclick=analyze;$('sample').onclick=()=>{$('times').value=initial;analyze()};$('times').addEventListener('input',()=>{clear();$('error').textContent='입력이 변경됐어. 다시 분석해.'});$('reset').onclick=()=>{$('times').value=initial;$('error').textContent='';clear()};$('play').onclick=()=>{if(!data&&!analyze())return;stop();let i=0;function next(){if(i>=data.length){$('preview').textContent='재생 완료';timer=null;return}$('preview').textContent='프레임 '+(i+1)+' / '+data.length;timer=setTimeout(next,data[i++])}next()};$('export').onclick=()=>{if(!data&&!analyze())return;const csv='frame,duration_ms,start_ms\r\n'+data.map((n,i)=>[i+1,n,data.slice(0,i).reduce((a,b)=>a+b,0)].join(',')).join('\r\n')+'\r\n';const a=document.createElement('a'),url=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));a.href=url;a.download='frame-pacing.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};})();</script></html>
