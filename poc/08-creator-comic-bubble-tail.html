<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CreatorComicBubbleTail · Service POC</title><style>
:root{font-family:system-ui,sans-serif;color:#eaf0ff;background:#101522}*{box-sizing:border-box}body{margin:0}main{max-width:1050px;margin:auto;padding:24px}h1{font-size:clamp(24px,4vw,38px);margin:10px 0}p{color:#b5c3db;line-height:1.6}.layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:18px}.card{background:#1a2335;border:1px solid #34445d;border-radius:18px;padding:18px}svg{width:100%;height:auto;display:block;background:#f9f3e7;border-radius:12px;touch-action:none;user-select:none}label{display:block;margin:14px 0 6px;color:#dce7fa;font-size:14px}input[type=range]{width:100%}input[type=text],textarea{width:100%;padding:10px;border-radius:8px;border:1px solid #52627b;background:#101522;color:white}button{background:#a88aff;color:#121124;border:0;border-radius:10px;padding:11px 13px;font-weight:700;cursor:pointer;margin:5px 4px 5px 0}button.secondary{background:#33435e;color:white}button:focus-visible{outline:3px solid white}small{color:#a9b7cf}.row{display:flex;flex-wrap:wrap;align-items:center;gap:5px}.stat{font-variant-numeric:tabular-nums;color:#c7d6f5}#hint{min-height:1.4em}@media(max-width:740px){.layout{grid-template-columns:1fr}main{padding:14px}}</style></head><body><main>
<a href="../index.html" style="color:#c6aaff">← Service POC</a><h1>CreatorComicBubbleTail</h1><p>캐릭터의 시작·끝 위치를 드래그하면 말풍선 꼬리가 캐릭터를 따라갑니다. 실제 영상 추적이 아닌, 두 키프레임 사이를 보간하는 핵심 동작 실험입니다.</p>
<div class="layout"><section class="card"><svg id="stage" viewBox="0 0 640 400" role="img" aria-label="드래그 가능한 만화 캐릭터와 말풍선 미리보기">
<defs><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#e1d9cc"/></pattern></defs><rect width="640" height="400" fill="url(#dots)"/><rect x="20" y="20" width="600" height="360" rx="16" fill="none" stroke="#c8b9a3" stroke-dasharray="5 7"/>
<path id="bubble" fill="#fff" stroke="#22283a" stroke-width="4" stroke-linejoin="round"/><text id="bubbleText" x="410" y="112" font-size="21" text-anchor="middle" fill="#22283a">안녕하세요!</text>
<g id="person" cursor="grab"><circle cx="0" cy="-31" r="32" fill="#ffcf9f" stroke="#293249" stroke-width="4"/><path d="M-37 -39 Q-34 -85 0 -71 Q42 -81 36 -36 Q12 -57 -3 -54 Q-20 -35 -37 -39" fill="#52466c"/><circle cx="-11" cy="-29" r="3.5"/><circle cx="11" cy="-29" r="3.5"/><path d="M-10 -13 Q0 -4 10 -13" fill="none" stroke="#754343" stroke-width="3"/><rect x="-38" y="4" width="76" height="88" rx="22" fill="#9185f4" stroke="#293249" stroke-width="4"/></g>
<circle id="handle" r="10" fill="#ed6e8a" stroke="#fff" stroke-width="3" cursor="grab"/><text id="caption" x="24" y="365" font-size="14" fill="#4d5260"></text></svg><p id="hint" aria-live="polite">캐릭터 또는 분홍 앵커를 드래그해 보세요.</p><div class="row"><button id="play">▶ 재생</button><button class="secondary" id="reset">초기화</button><button class="secondary" id="download">SVG 저장</button></div></section>
<aside class="card"><strong>키프레임 편집</strong><p>편집할 프레임을 고른 뒤 캐릭터를 움직이세요. 꼬리는 말풍선의 아래쪽에서 캐릭터 머리로 연결됩니다.</p><div class="row"><button id="start" class="secondary">시작 위치</button><button id="end" class="secondary">끝 위치</button></div><label for="time">타임라인 <span id="timeValue">0%</span></label><input id="time" type="range" min="0" max="100" value="0"><label for="duration">재생 시간 <span id="durationValue">2.0초</span></label><input id="duration" type="range" min="0.5" max="6" step="0.5" value="2"><label for="speech">말풍선 텍스트</label><input id="speech" type="text" maxlength="24" value="안녕하세요!"><label for="anchorX">말풍선 가로 위치 <span id="anchorValue">410</span></label><input id="anchorX" type="range" min="250" max="520" value="410"><p class="stat" id="coords"></p><small>제약: 자동 인물 감지, 영상 파일 분석, 프레임별 모션 추적은 지원하지 않습니다.</small></aside></div></main>
<script>
'use strict';
const $=id=>document.getElementById(id);
const defaults=()=>({a:{x:160,y:265},b:{x:300,y:265},anchor:{x:410,y:102},t:0,duration:2,selected:'a'});
let state=defaults(),playing=false,raf=0,drag=null,last=0;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t;
function position(){return{x:lerp(state.a.x,state.b.x,state.t),y:lerp(state.a.y,state.b.y,state.t)}}
function render(){const p=position(),a=state.anchor; $('person').setAttribute('transform','translate('+p.x+' '+p.y+')');$('handle').setAttribute('cx',a.x);$('handle').setAttribute('cy',a.y);
const left=a.x-110,right=a.x+110,top=a.y-43,bottom=a.y+43,targetX=p.x,targetY=p.y-68;
const baseX=clamp(targetX,left+28,right-28),tailLeft=baseX-16,tailRight=baseX+16;
$('bubble').setAttribute('d', 'M '+(left+22)+' '+top+' H '+(right-22)+' Q '+right+' '+top+' '+right+' '+(top+22)+' V '+(bottom-22)+' Q '+right+' '+bottom+' '+(right-22)+' '+bottom+' H '+tailRight+' L '+targetX+' '+targetY+' L '+tailLeft+' '+bottom+' H '+(left+22)+' Q '+left+' '+bottom+' '+left+' '+(bottom-22)+' V '+(top+22)+' Q '+left+' '+top+' '+(left+22)+' '+top+' Z');
$('bubbleText').setAttribute('x',a.x);$('bubbleText').setAttribute('y',a.y+7);$('bubbleText').textContent=$('speech').value.slice(0,24)||'…';$('time').value=Math.round(state.t*100);$('timeValue').textContent=Math.round(state.t*100)+'%';$('durationValue').textContent=state.duration.toFixed(1)+'초';$('anchorX').value=a.x;$('anchorValue').textContent=Math.round(a.x);$('coords').textContent='현재 캐릭터: '+Math.round(p.x)+', '+Math.round(p.y)+' · 편집: '+(state.selected==='a'?'시작':'끝');$('caption').textContent='키프레임 '+(state.selected==='a'?'시작':'끝')+' 편집 · '+Math.round(state.t*100)+'%';}
function stop(){playing=false;cancelAnimationFrame(raf);$('play').textContent='▶ 재생';}
function select(which){stop();state.selected=which;state.t=which==='a'?0:1;render();}
$('start').onclick=()=>select('a');$('end').onclick=()=>select('b');
$('time').oninput=e=>{stop();state.t=Number(e.target.value)/100;render()};
$('duration').oninput=e=>{state.duration=Number(e.target.value);render()};
$('speech').oninput=render;$('anchorX').oninput=e=>{state.anchor.x=Number(e.target.value);render()};
$('reset').onclick=()=>{stop();state=defaults();$('speech').value='안녕하세요!';$('duration').value=2;render();$('hint').textContent='초기 상태로 돌아왔습니다.'};
$('play').onclick=()=>{if(playing){stop();return}playing=true;state.t=0;last=performance.now();$('play').textContent='Ⅱ 일시정지';const tick=now=>{if(!playing)return;state.t=clamp(state.t+(now-last)/(state.duration*1000),0,1);last=now;render();if(state.t>=1){stop();return}raf=requestAnimationFrame(tick)};raf=requestAnimationFrame(tick)};
const svg=$('stage');function point(e){const r=svg.getBoundingClientRect();return{x:clamp((e.clientX-r.left)*640/r.width,42,598),y:clamp((e.clientY-r.top)*400/r.height,92,338)}}
svg.addEventListener('pointerdown',e=>{if(e.target.closest('#person'))drag='person';else if(e.target.id==='handle'||e.target.id==='bubble'||e.target.id==='bubbleText')drag='anchor';else return;stop();svg.setPointerCapture(e.pointerId);e.preventDefault()});
svg.addEventListener('pointermove',e=>{if(!drag)return;const p=point(e);if(drag==='person'){const k=state.selected;state[k]={x:p.x,y:clamp(p.y,140,300)};state.t=k==='a'?0:1}else{state.anchor.x=clamp(p.x,250,520);state.anchor.y=clamp(p.y,65,170)}render()});
for(const event of ['pointerup','pointercancel','lostpointercapture'])svg.addEventListener(event,()=>drag=null);
$('download').onclick=()=>{const clone=svg.cloneNode(true);clone.removeAttribute('id');clone.querySelector('#handle').remove();clone.querySelector('#caption').remove();clone.setAttribute('xmlns','http://www.w3.org/2000/svg');const blob=new Blob([new XMLSerializer().serializeToString(clone)],{type:'image/svg+xml'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='comic-bubble-tail-frame.svg';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);$('hint').textContent='현재 프레임을 SVG로 저장했습니다.'};
render();
</script></body></html>
