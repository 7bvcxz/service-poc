<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CreatorTileGroutPatternFlow</title><style>
:root{font-family:system-ui,sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0b1220;color:#eaf0ff}main{max-width:1120px;margin:auto;padding:28px 18px}h1{font-size:clamp(25px,4vw,40px);margin:8px 0}p{color:#aebbd2;line-height:1.6}.layout{display:grid;grid-template-columns:310px 1fr;gap:20px}.panel{background:#182338;border:1px solid #33425d;border-radius:18px;padding:20px}label{display:block;margin:16px 0 5px;font-weight:650}input,select,button{font:inherit}input[type=number],select{width:100%;padding:10px;background:#0d1728;color:white;border:1px solid #52627c;border-radius:9px}input[type=range]{width:100%;accent-color:#80baff}button{border:0;border-radius:10px;background:#79b6ff;color:#08111d;padding:12px 16px;cursor:pointer;font-weight:750;margin:8px 6px 0 0}button.secondary{background:#364761;color:#fff}canvas{width:100%;height:auto;background:#fff;border-radius:10px;touch-action:none}#stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}.stat{background:#0d1728;border-radius:10px;padding:12px;font-size:13px;color:#bdcce2}.stat strong{display:block;font-size:22px;color:white}small{color:#9eabc1}#status{color:#b7e9cf;min-height:24px}@media(max-width:750px){.layout{grid-template-columns:1fr}#stats{grid-template-columns:1fr 1fr}}</style></head><body><main><small>OFFLINE CREATOR LAB · 원장 ID 20261111-03-01 · 재평가 92/100</small><h1>Tile & Grout Pattern Flow</h1><p>타일 크기와 줄눈을 바꾸면 실제 작업 영역에 맞는 격자·가장자리 절단 조각이 즉시 다시 계산됩니다. 설계용 미리보기이며 실제 시공 정밀도를 보증하지 않습니다.</p><div class="layout"><section class="panel"><h2>패턴 설정</h2><label for="width">작업 폭 (mm)</label><input id="width" type="number" min="100" max="5000" value="780"><label for="height">작업 높이 (mm)</label><input id="height" type="number" min="100" max="5000" value="520"><label for="tile">정사각 타일 한 변 (mm)</label><input id="tile" type="number" min="10" max="500" value="100"><label for="grout">줄눈 폭: <output id="groutVal">5</output> mm</label><input id="grout" type="range" min="0" max="30" step="1" value="5"><label for="offset">행별 엇갈림: <output id="offsetVal">0</output>%</label><input id="offset" type="range" min="0" max="50" step="5" value="0"><label for="color">색상 패턴</label><select id="color"><option value="checker">체커보드</option><option value="stripe">행별 줄무늬</option><option value="plain">단색</option></select><div><button id="export">SVG 다운로드</button><button id="reset" class="secondary">초기화</button></div><p id="status" role="status"></p></section><section class="panel"><h2>즉시 미리보기</h2><canvas id="preview" width="900" height="650" aria-label="줄눈과 절단 타일 미리보기"></canvas><div id="stats"><div class="stat">전체 타일 조각<strong id="pieces">—</strong></div><div class="stat">절단 조각<strong id="cuts">—</strong></div><div class="stat">줄눈 폭 비율<strong id="ratio">—</strong></div></div><small>주황색 외곽선 = 작업 영역 경계에서 절단되는 타일. 수량은 시각화된 조각 수이며 구매 수량·시공 견적이 아닙니다.</small></section></div></main><script>
'use strict';const $=id=>document.getElementById(id),ids=['width','height','tile','grout','offset','color'];let svg='';
function render(){let w=+$('width').value,h=+$('height').value,t=+$('tile').value,g=+$('grout').value,off=+$('offset').value/100;if(![w,h,t,g,off].every(Number.isFinite)||w<100||h<100||t<10||w>5000||h>5000||t>500||g<0||g>30){$('status').textContent='입력 범위를 확인해 주세요.';return}const pitch=t+g,cols=Math.ceil(w/pitch)+3,rows=Math.ceil(h/pitch)+2;if(cols*rows>15000){$('status').textContent='타일 수가 너무 많습니다. 크기를 조정하세요.';return}let c=$('preview'),ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height);const pad=32,scale=Math.min((c.width-pad*2)/w,(c.height-pad*2)/h),ox=(c.width-w*scale)/2,oy=(c.height-h*scale)/2;ctx.fillStyle='#d4d7de';ctx.fillRect(ox,oy,w*scale,h*scale);let rects=[],count=0,cuts=0;const colors=['#71b8bd','#f0b66b','#6774a7','#e7e4da'];for(let row=0;row<rows;row++){let y=row*pitch+g/2,shift=(row%2)*off*pitch;for(let col=-2;col<cols;col++){let x=col*pitch+g/2+shift,x0=Math.max(0,x),y0=Math.max(0,y),x1=Math.min(w,x+t),y1=Math.min(h,y+t);if(x1<=x0||y1<=y0)continue;let cut=x0>x||y0>y||x1<x+t||y1<y+t;count++;if(cut)cuts++;let color=$('color').value==='plain'?colors[0]:$('color').value==='stripe'?colors[row%2]:colors[(row+col+400)%4];ctx.fillStyle=color;ctx.fillRect(ox+x0*scale,oy+y0*scale,(x1-x0)*scale,(y1-y0)*scale);if(cut){ctx.strokeStyle='#e66c24';ctx.lineWidth=2;ctx.strokeRect(ox+x0*scale,oy+y0*scale,(x1-x0)*scale,(y1-y0)*scale)}rects.push('<rect x="'+x0.toFixed(2)+'" y="'+y0.toFixed(2)+'" width="'+(x1-x0).toFixed(2)+'" height="'+(y1-y0).toFixed(2)+'" fill="'+color+'"'+(cut?' stroke="#e66c24" stroke-width="1"':'')+'/>')}}ctx.strokeStyle='#202b40';ctx.lineWidth=3;ctx.strokeRect(ox,oy,w*scale,h*scale);$('pieces').textContent=count.toLocaleString();$('cuts').textContent=cuts.toLocaleString();$('ratio').textContent=(100*g/pitch).toFixed(1)+'%';$('groutVal').textContent=g;$('offsetVal').textContent=off*100;$('status').textContent='설계 미리보기가 갱신되었습니다.';svg='<svg xmlns="http://www.w3.org/2000/svg" width="'+w+'mm" height="'+h+'mm" viewBox="0 0 '+w+' '+h+'"><rect width="'+w+'" height="'+h+'" fill="#d4d7de"/>'+rects.join('')+'</svg>'}
ids.forEach(id=>$(id).addEventListener('input',render));$('reset').addEventListener('click',()=>{Object.entries({width:780,height:520,tile:100,grout:5,offset:0,color:'checker'}).forEach(([k,v])=>$(k).value=v);render()});$('export').addEventListener('click',()=>{if(!svg)return;let url=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'})),a=document.createElement('a');a.href=url;a.download='tile-grout-pattern.svg';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);$('status').textContent='SVG 파일을 저장했습니다.'});render();
</script></body></html>
